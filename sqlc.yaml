version: "2"
sql:
  - engine: postgresql
    # Points at the goose migrations so there is ONE definition of the schema.
    # A separate schema.sql alongside migrations is a second source of truth
    # that will silently drift. (Roles/grants live in deploy/sql/ precisely so
    # this path only ever contains parseable schema DDL.)
    schema: migrations
    queries: internal/store/queries
    gen:
      go:
        package: gen
        out: internal/store/gen
        sql_package: pgx/v5
        emit_interface: true                  # Querier iface, for test fakes
        emit_pointers_for_null_types: true    # *string beats pgtype.Text
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: timestamptz
            go_type: time.Time
          # Nullable timestamptz — lease_expires_at, published_at
          - db_type: timestamptz
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
