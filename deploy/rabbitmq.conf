# Mounted at /etc/rabbitmq/conf.d/20-sluice.conf (additive to the image's
# own 10-defaults.conf). There is no environment variable for consumer_timeout,
# which is why this file has to exist at all.

# How long a delivery may sit unacked before the broker closes the channel.
# Default is 30 min. A job that legitimately runs longer than this looks
# exactly like a crashed worker, and presents as a confusing channel error
# rather than a timeout.
#
# Invariant, validated at gateway boot:
#   CONSUMER_TIMEOUT > p99 job duration
#   CONSUMER_TIMEOUT > JOB_DEADLINE_DEFAULT (5m)
#
# See docs/05_messaging_topology.md#consumer_timeout and
# docs/07_reliability_and_drills.md#The two clocks problem — the gap between
# this and LEASE_TTL (30s) is why the reaper republishes when it requeues.
consumer_timeout = 900000

# Log to stdout so `docker compose logs rabbitmq` is useful.
log.console = true
log.console.level = info
log.file = false
