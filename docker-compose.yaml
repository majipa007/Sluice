services:
  pg-admin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: pg_admin_gamile@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    depends_on:
      - postgres
    networks:
      - sluice-network
    volumes:
      - pg-admin-data:/var/lib/pgadmin

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: sluice
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sluice-network

  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: sluice
      RABBITMQ_DEFAULT_PASS: sluice_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
  pg-admin-data:

networks:
  sluice-network:
    driver: bridge
